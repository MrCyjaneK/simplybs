name: Build Android with from-source NDK

on:
  push:
    branches: [cyjan-wip-experiments]
    tags: ['v*']
  pull_request:
    branches: [cyjan-wip-experiments]
  workflow_dispatch:

jobs:
  build-android:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7a-linux-androideabi, x86_64-linux-android]

    steps:
      - name: Checkout simplybs
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 cmake make \
            autoconf automake libtool pkg-config gperf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build simplybs
        run: go build -o simplybs .

      - name: Cache simplybs build artifacts
        uses: actions/cache@v4
        with:
          path: .buildlib
          key: simplybs-${{ matrix.target }}-${{ hashFiles('packages/**') }}
          restore-keys: |
            simplybs-${{ matrix.target }}-

      - name: Build openssl for ${{ matrix.target }}
        run: ./simplybs -host ${{ matrix.target }} -package openssl -build

      - name: Build remaining Android dependencies
        run: |
          for pkg in sodium zeromq unbound boost@1_83_0; do
            echo "--- Building $pkg ---"
            ./simplybs -host ${{ matrix.target }} -package $pkg -build
          done

      - name: Package built libraries
        run: |
          tar czf simplybs-${{ matrix.target }}.tar.gz -C .buildlib/env .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplybs-${{ matrix.target }}
          path: simplybs-${{ matrix.target }}.tar.gz

      - name: Summary
        run: |
          echo "=== Build complete for ${{ matrix.target }} ==="
          echo "Built packages:"
          find .buildlib -name "*.tar.gz" -path "*/built/*" | sort
          echo ""
          echo "Environment libs:"
          ls .buildlib/env/lib/ 2>/dev/null | head -20 || echo "No env/lib"

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android Dependencies ${{ github.ref_name }}
          body: |
            Prebuilt Android dependencies built by simplybs.

            **Targets:**
            - `aarch64-linux-android`
            - `armv7a-linux-androideabi`
            - `x86_64-linux-android`

            **Packages:** openssl, sodium, zeromq, unbound, boost

            Built from commit ${{ github.sha }}
          files: artifacts/**/*.tar.gz
