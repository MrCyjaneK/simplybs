name: packages-macos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: commit SHA to build
        required: false
        type: string
      base:
        description: git diff base SHA
        required: false
        type: string
      pr:
        description: pull request number for the sticky comment
        required: false
        type: string
      package:
        description: extra dirty package root (e.g. zlib)
        required: false
        type: string

# macOS package queue, parallel with .github/workflows/packages.yml (linux).
# Three batches of 24 slots (72 packages per run) so a zlib-tree cold fill
# fits without failing the finish job on the old 24-slot cap.
# Release cache tag is CI-only (v0-sbs-ci-darwin-arm64). Do not use the
# human/cloud-agent tag (v0-sbs-ubuntu-linux-amd64).
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: read

jobs:
  meta:
    runs-on: puzl-ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      base: ${{ steps.meta.outputs.base }}
      pr: ${{ steps.meta.outputs.pr }}
      extra_package: ${{ steps.meta.outputs.extra_package }}
      cache_tag: ${{ steps.meta.outputs.cache_tag }}
    steps:
      - name: Resolve refs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              sha="${{ inputs.sha }}"
              base="${{ inputs.base }}"
              pr="${{ inputs.pr }}"
              extra="${{ inputs.package }}"
              ;;
            pull_request)
              sha="${{ github.event.pull_request.head.sha }}"
              base="${{ github.event.pull_request.base.sha }}"
              pr="${{ github.event.pull_request.number }}"
              extra=""
              ;;
            *)
              sha="${{ github.sha }}"
              base="${{ github.event.before }}"
              pr=""
              extra=""
              ;;
          esac
          sha="${sha:-${{ github.sha }}}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.pull_request.base.sha || github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "extra_package=$extra" >> "$GITHUB_OUTPUT"
          echo "cache_tag=v0-sbs-ci-darwin-arm64" >> "$GITHUB_OUTPUT"
          echo "Resolved sha=$sha base=$base pr=$pr extra=$extra cache_tag=v0-sbs-ci-darwin-arm64"

      - name: Mark commit pending
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context=simplybs-packages-macos \
            -f description="macos package queue running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  batch1:
    needs: [meta]
    uses: ./.github/workflows/package-batch.yml
    secrets: inherit
    with:
      runner: macos-latest
      sha: ${{ needs.meta.outputs.sha }}
      base: ${{ needs.meta.outputs.base }}
      pr: ${{ needs.meta.outputs.pr }}
      cache_tag: ${{ needs.meta.outputs.cache_tag }}
      cache_repo: ${{ github.repository }}
      hosts: aarch64-apple-darwin
      extra_package: ${{ needs.meta.outputs.extra_package }}
      comment_queue: macos
  batch2:
    needs: [meta, batch1]
    if: needs.batch1.outputs.continue == 'true'
    uses: ./.github/workflows/package-batch.yml
    secrets: inherit
    with:
      runner: macos-latest
      sha: ${{ needs.meta.outputs.sha }}
      base: ${{ needs.meta.outputs.base }}
      pr: ${{ needs.meta.outputs.pr }}
      cache_tag: ${{ needs.meta.outputs.cache_tag }}
      cache_repo: ${{ github.repository }}
      hosts: aarch64-apple-darwin
      extra_package: ${{ needs.meta.outputs.extra_package }}
      comment_queue: macos
  batch3:
    needs: [meta, batch2]
    if: needs.batch2.outputs.continue == 'true'
    uses: ./.github/workflows/package-batch.yml
    secrets: inherit
    with:
      runner: macos-latest
      sha: ${{ needs.meta.outputs.sha }}
      base: ${{ needs.meta.outputs.base }}
      pr: ${{ needs.meta.outputs.pr }}
      cache_tag: ${{ needs.meta.outputs.cache_tag }}
      cache_repo: ${{ github.repository }}
      hosts: aarch64-apple-darwin
      extra_package: ${{ needs.meta.outputs.extra_package }}
      comment_queue: macos
  finish:
    if: always()
    needs: [meta, batch1, batch2, batch3]
    runs-on: puzl-ubuntu-latest
    steps:
      - name: Set commit status
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          C1: ${{ needs.batch1.outputs.continue }}
          C2: ${{ needs.batch2.outputs.continue }}
          C3: ${{ needs.batch3.outputs.continue }}
          R1: ${{ needs.batch1.result }}
          R2: ${{ needs.batch2.result }}
          R3: ${{ needs.batch3.result }}
          META: ${{ needs.meta.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=0
          if [ "$META" = "failure" ]; then failed=1; fi
          for r in "$R1" "$R2" "$R3"; do
            if [ "$r" = "failure" ]; then failed=1; fi
          done
          last=""
          for v in "$C3" "$C2" "$C1"; do
            if [ -n "$v" ]; then last=$v; break; fi
          done
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$failed" = 1 ]; then
            state=failure
            desc="macos package queue failed"
          elif [ "$last" = "true" ]; then
            state=failure
            desc="macos package queue hit slot cap; re-run workflow"
          else
            state=success
            desc="macos package queue complete"
          fi
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="$state" \
            -f context=simplybs-packages-macos \
            -f description="$desc" \
            -f target_url="$url"
          if [ "$state" != "success" ]; then
            exit 1
          fi
