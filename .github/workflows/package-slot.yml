name: package-slot

on:
  workflow_call:
    inputs:
      image:
        description: GHCR image for Linux container slots; empty = bare runner (macOS)
        required: false
        type: string
        default: ""
      runner:
        description: GitHub-hosted runner label
        required: false
        type: string
        default: ubuntu-latest
      sha:
        required: true
        type: string
      base:
        required: true
        type: string
      pr:
        required: false
        type: string
        default: ""
      cache_tag:
        description: GitHub Release cache tag (CI-only, e.g. v0-sbs-ci-linux-amd64)
        required: true
        type: string
      cache_repo:
        required: true
        type: string
      hosts:
        required: true
        type: string
      extra_package:
        required: false
        type: string
        default: ""
      comment_queue:
        description: sticky-comment id (empty = linux)
        required: false
        type: string
        default: ""
    outputs:
      continue:
        description: whether another slot should run
        value: ${{ jobs.slot.outputs.continue }}

jobs:
  slot:
    runs-on: ${{ inputs.runner }}
    # One package build. Native toolchains (ct-tools, rust, osx-cross) can
    # take hours; GitHub would kill the job at the default 6h workflow cap
    # anyway, so this matches that for a single slot.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    outputs:
      continue: ${{ steps.work.outputs.continue }}
    # fromJSON('null') omits the container so macOS jobs run on the host.
    container: ${{ inputs.image != '' && fromJSON(format('{{"image":"{0}","options":"--user 1001:1001","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.image, github.actor, github.token)) || fromJSON('null') }}
    env:
      SIMPLYBS_CACHE_TAG: ${{ inputs.cache_tag }}
      SIMPLYBS_CACHE_REPO: ${{ inputs.cache_repo }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOCACHE: /tmp/go-cache
      GOMODCACHE: /tmp/go-modcache
      GOTMPDIR: /tmp/go-tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Writable Go dirs
        run: mkdir -p "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR"
      - name: Container HOME
        if: ${{ inputs.image != '' }}
        run: echo "HOME=/home/ci" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        if: ${{ inputs.image == '' }}
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/package-slot
        id: work
        with:
          sha: ${{ inputs.sha }}
          base: ${{ inputs.base }}
          pr: ${{ inputs.pr }}
          hosts: ${{ inputs.hosts }}
          extra_package: ${{ inputs.extra_package }}
          comment_queue: ${{ inputs.comment_queue }}
