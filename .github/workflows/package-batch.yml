          C02: ${{ needs.slot02.outputs.continue }}
          C01: ${{ needs.slot01.outputs.continue }}
        run: |
          # Last non-empty continue (skipped slots have empty outputs).
          for v in "$C24" "$C23" "$C22" "$C21" "$C20" "$C19" "$C18" "$C17" "$C16" "$C15" "$C14" "$C13" "$C12" "$C11" "$C10" "$C09" "$C08" "$C07" "$C06" "$C05" "$C04" "$C03" "$C02" "$C01"; do
            if [ -n "$v" ]; then
              echo "continue=$v" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "continue=false" >> "$GITHUB_OUTPUT"

