name: package-batch

# 24 serial package slots. packages.yml calls this three times
# (72 packages per run) so a zlib-tree cold fill fits in one workflow.
on:
  workflow_call:
    inputs:
      image:
        description: GHCR image for Linux container slots; empty = bare runner
        required: false
        type: string
        default: ""
      runner:
        description: GitHub-hosted runner label
        required: false
        type: string
        default: ubuntu-latest
      sha:
        required: true
        type: string
      base:
        required: true
        type: string
      pr:
        required: false
        type: string
        default: ""
      cache_tag:
        required: true
        type: string
      cache_repo:
        required: true
        type: string
      hosts:
        required: true
        type: string
      extra_package:
        required: false
        type: string
        default: ""
      comment_queue:
        description: sticky-comment id (empty = linux)
        required: false
        type: string
        default: ""
    outputs:
      continue:
        description: whether another batch should run
        value: ${{ jobs.summarize.outputs.continue }}

jobs:
  slot01:
    uses: ./.github/workflows/package-slot.yml
    secrets: inherit
    with:
      image: ${{ inputs.image }}
      runner: ${{ inputs.runner }}
      sha: ${{ inputs.sha }}
      base: ${{ inputs.base }}
      pr: ${{ inputs.pr }}
      cache_tag: ${{ inputs.cache_tag }}
      cache_repo: ${{ inputs.cache_repo }}
      hosts: ${{ inputs.hosts }}
      extra_package: ${{ inputs.extra_package }}
      comment_queue: ${{ inputs.comment_queue }}
  slot02:
    needs: [slot01]
    if: needs.slot01.outputs.continue == 'true'
    uses: ./.github/workflows/package-slot.yml
    secrets: inherit
