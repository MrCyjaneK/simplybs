name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: x86_64-linux-gnu
          - os: macos-latest
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Lint packages
        run: |
          go run . -lint
          git diff --exit-code -- packages sources.json
      - name: CLI smoke
        run: go run . -host ${{ matrix.host }} -package zlib -list
      - name: ciqueue smoke (no package changes)
        run: |
          : > /tmp/changed
          go run ./cmd/ciqueue next -changed-files /tmp/changed | tee /tmp/ciqueue.json
          python3 -c 'import json,sys; s=json.load(open("/tmp/ciqueue.json")); assert s["status"]=="done", s'
